# Amaterasu — nginx vhost.
# Copy to /etc/nginx/conf.d/amaterasu.conf, replace charts.example.com with your domain,
# then run: sudo nginx -t && sudo systemctl reload nginx
# Finally add TLS: sudo certbot --nginx -d YOUR_DOMAIN --agree-tos -m YOU@EXAMPLE.COM --redirect
# (certbot adds the 443 server block and the HTTP→HTTPS redirect.)

server {
    listen 80;
    listen [::]:80;
    server_name charts.example.com;

    # Let the ACME HTTP-01 challenge through without basic auth (certbot uses this).
    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        auth_basic off;
    }

    # Server-sent events: no buffering, no cache, long-lived reads.
    location /api/stream {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
        auth_basic "Amaterasu";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # Everything else: the app (API + static SPA).
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        auth_basic "Amaterasu";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
}

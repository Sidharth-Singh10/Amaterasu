[package]
name = "amaterasu-server"
version = "0.0.1"
edition = "2024"
description = "Amaterasu backend: INDmoney MCP bridge, OpenCode bridge, SSE, static hosting"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
futures-util = { version = "0.3.34", features = ["std"] }
rand = "0.10.2"
reqwest = { version = "0.13.5", features = ["json", "gzip", "form", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "sync"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2.1.3"

[dev-dependencies]

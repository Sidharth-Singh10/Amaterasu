[package]
name = "amaterasu-server"
version = "0.0.1"
edition = "2024"
description = "Amaterasu backend: INDmoney MCP bridge, OpenCode bridge, SSE, static hosting"

[dependencies]
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
